<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الطعام الفاخرة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>✨ أهلاً وسهلاً بكم ✨</h1>
        <div class="table-badge">طاولة رقم: <span id="table-number">--</span></div>
    </header>

    <nav class="categories">
        <button class="cat-btn active" onclick="filterCategory('all')">✨ الكل</button>
        <button class="cat-btn" onclick="filterCategory('مشروبات')">🥤 مشروبات</button>
        <button class="cat-btn" onclick="filterCategory('شرقي')">🥙 أكل شرقي</button>
        <button class="cat-btn" onclick="filterCategory('غربي')">🍕 أكل غربي</button>
        <button class="cat-btn" onclick="filterCategory('مقبلات')">🍟 مقبلات</button>
        <button class="cat-btn" onclick="filterCategory('حلويات')">🍰 حلويات</button>
    </nav>

    <main class="menu-container" id="menu-items">
        <!-- الوجبات ستظهر هنا تلقائياً -->
    </main>

    <div class="cart-floating-btn" onclick="window.location.href='cart.html'">
        🛒 <span id="cart-count">0</span>
    </div>

    <!-- استدعاء Firebase بالطريقة المضمونة -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- استدعاء ملف السكريبت -->
    <script src="script.js"></script>
</body>
</html>
